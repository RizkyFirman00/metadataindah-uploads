services:
  indah-ui:
    build:
      context: .
    container_name: indah-metadata-ui
    user: "1001:1001"
    working_dir: /app
    command: ["python", "indah_ui.py", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    environment:
      PYTHONUNBUFFERED: "1"
      HOME: /app/.indah_session
    volumes:
      - .:/app
    restart: unless-stopped
