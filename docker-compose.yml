services:
  indah-ui:
    build:
      context: .
    container_name: indah-metadata-ui
    working_dir: /app
    command: ["python", "indah_ui.py", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/app
    restart: unless-stopped
